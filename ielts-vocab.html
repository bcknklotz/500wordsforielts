<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#14161a; --muted:#6b7280;
  --accent:#3b6ef6; --accent-weak:#e7edff; --border:#e5e7eb;
  --correct:#2f9e5c; --correct-bg:#e8f7ee; --wrong:#d24b4b; --wrong-bg:#fdeceb;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --card:#1b1e24; --text:#f2f3f5; --muted:#9aa0aa;
    --accent:#5b8cff; --accent-weak:#232a44; --border:#2a2d34;
    --correct:#4fce85; --correct-bg:#183024; --wrong:#ef6b6b; --wrong-bg:#341c1c;
  }
}
:root[data-theme="dark"]{
  --bg:#111317; --card:#1b1e24; --text:#f2f3f5; --muted:#9aa0aa;
  --accent:#5b8cff; --accent-weak:#232a44; --border:#2a2d34;
  --correct:#4fce85; --correct-bg:#183024; --wrong:#ef6b6b; --wrong-bg:#341c1c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow-x:hidden;
  transition:background-color .25s ease, color .25s ease;
}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));}
h1,h2,h3,p{margin:0}
.header{padding-top:calc(4px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;margin-bottom:14px}
.header button{background:none;border:none;color:var(--accent);font-size:20px;padding:6px;cursor:pointer;line-height:1;transition:color .25s ease;border-radius:10px}
.header button:active{background:var(--accent-weak)}
.header h2{font-size:17px;font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:background-color .25s ease,border-color .25s ease}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:none;font-size:16px;font-weight:600;cursor:pointer;text-align:center;min-height:48px;transition:transform .1s ease, background-color .25s ease, opacity .2s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-text{background:none;color:var(--muted);font-weight:500;box-shadow:none;padding:10px}
.btn+.btn{margin-top:10px}
.progressbar{height:8px;border-radius:6px;background:var(--accent-weak);overflow:hidden;margin:10px 0;transition:background-color .25s ease}
.progressbar>div{height:100%;background:var(--accent);border-radius:6px;transition:width .3s, background-color .25s ease}
.stat-row{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:4px 0}
.muted{color:var(--muted);font-size:13px}
.big{font-size:22px;font-weight:700}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;margin-bottom:10px;min-height:48px;cursor:pointer;transition:transform .1s ease, background-color .2s ease, border-color .2s ease}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct)}
.opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
.opt:disabled{opacity:.6}
.word-en{font-size:26px;font-weight:700;letter-spacing:.2px}
.ipa{color:var(--muted);font-size:15px;margin-top:2px}
.pos{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--border);padding:2px 8px;border-radius:8px;margin-top:6px}
.dots{display:flex;gap:6px;margin:10px 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--border);transition:background-color .25s ease}
.dot.on{background:var(--accent)}
.swatches{display:flex;gap:14px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--border) inset}
.swatch.active{border-color:var(--text)}
.deckrow{display:flex;gap:10px;margin-bottom:14px}
.deckchip{flex:1;padding:11px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
.deckchip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.feedback-title{font-size:15px;font-weight:600;margin-bottom:10px}
.feedback-title.ok{color:var(--correct)}
.feedback-title.no{color:var(--wrong)}
.ex{margin-top:12px;font-size:14px;line-height:1.5}
.ex .en{font-style:italic}
.ex .ru{color:var(--muted);margin-top:4px}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.list-item:last-child{border-bottom:none}
.li-left .en{font-weight:600;font-size:15px}
.li-left .ru{color:var(--muted);font-size:13px;margin-top:2px}
.badge{font-size:11px;padding:3px 8px;border-radius:8px;background:var(--accent-weak);color:var(--accent);white-space:nowrap;margin-left:8px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;min-height:36px}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;margin-bottom:12px;min-height:44px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:50}
.modal{background:var(--card);border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:480px;margin:0 auto;max-height:80vh;overflow-y:auto}
.row-between{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
</style>
</head>

/* Прогресс всегда хранится с номером схемы {v, data}. Старые записи (без обёртки, ещё "сырой" словарь)
   читаются как есть и при первом же сохранении автоматически переоборачиваются — прогресс не теряется.
   При будущих изменениях формата сюда достаточно добавить миграцию по значению raw.v. */
function loadProgress(){
  try{
    var raw = JSON.parse(localStorage.getItem(STORE_KEY));
    if(!raw) return {};
    if(raw.v && raw.data) return raw.data;
    return raw; // легаси-формат без обёртки
  }catch(e){ return {}; }
}
function saveProgress(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({v:PROGRESS_SCHEMA, data:p})); }catch(e){} }

  try{ m=JSON.parse(localStorage.getItem(META_KEY))||{}; }catch(e){ m={}; }
  if(!m.unlockedBlockByDeck){
    var old=null; try{ old=JSON.parse(localStorage.getItem('ievocab_meta_v1')); }catch(e){}
    m.unlockedBlockByDeck = {core500:(old&&old.unlockedBlock)||1, top100:1};
  }
  m.theme = m.theme||'blue';
  m.mode = m.mode||'auto';
  m.blockSize = m.blockSize||5;
  m.masterTarget = m.masterTarget||5;
  m.hlColor = m.hlColor||'blue';
  m.deck = (m.deck && DECKS[m.deck] && !DECKS[m.deck].hidden) ? m.deck : 'top100';
  return m;
}
function saveMeta(m){ try{localStorage.setItem(META_KEY, JSON.stringify(m));}catch(e){} }
var progress = loadProgress();
var meta = loadMeta();
applyMode(); applyThemeVars(); applyHighlightVars();

function blockSize(){ return meta.blockSize||5; }
function masterTarget(){ return meta.masterTarget||5; }
function wordBlock(w){ return Math.ceil(w.order/blockSize()); }
function totalBlocks(){ return Math.ceil(currentWords().length/blockSize()); }
function unlockedBlock(){ return meta.unlockedBlockByDeck[meta.deck]||1; }
function setUnlockedBlock(n){ meta.unlockedBlockByDeck[meta.deck]=n; }

function ensure(id){ if(!progress[id]) progress[id]={c:0,w:0,last:0}; return progress[id]; }
function isMastered(id){ return ensure(id).c>=masterTarget(); }
function status(id){
  var p=ensure(id);
  if(p.c>=masterTarget()) return 'mastered';
  if(p.c===0 && p.w===0) return 'new';
  return 'learning';
}
function unlockedWords(){ var ub=unlockedBlock(); return currentWords().filter(function(w){return wordBlock(w)<=ub;}); }
function checkUnlock(){
  /* Следующий блок открывается, только когда все слова текущего блока достигли цели закрепления. Возвращает true, если блок открылся. */
  var opened=false;
  while(true){
    var ub=unlockedBlock();
    var blockWords = currentWords().filter(function(w){return wordBlock(w)===ub;});
    var ready = blockWords.length>0 && blockWords.every(function(w){return isMastered(w.id);});
    if(ready && ub<totalBlocks()){ setUnlockedBlock(ub+1); opened=true; } else break;
  }
  if(opened) saveMeta(meta);
  return opened;
}
/* Пересчитать разблокированный блок после смены размера блока в настройках */
function recomputeUnlockedBlock(){
  var maxOrder=0;
  currentWords().forEach(function(w){ var p=progress[w.id]; if(p && (p.c>0||p.w>0)) maxOrder=Math.max(maxOrder,w.order); });
  setUnlockedBlock(Math.max(1, Math.min(totalBlocks(), Math.ceil(maxOrder/blockSize()) || 1)));
}

/* Подсветка слова (во всех формах) внутри примера-предложения */
/* Автоподбор дистракторов из той же колоды: избегаем слов с пересекающимся переводом (близких синонимов) */
function tokenize(s){ return (s||'').toLowerCase().replace(/[();]/g,'').split(/[\s,;]+/).filter(Boolean); }
function pickDistractors(word){
  var pool = currentWords().filter(function(x){return x.id!==word.id;});
  var wTok = tokenize(word.ru);
  var safe = pool.filter(function(c){
    var cTok = tokenize(c.ru);
    return !cTok.some(function(t){return wTok.indexOf(t)>=0;});
  });
  var source = safe.length>=3 ? safe : pool;
  return shuffle(source.slice()).slice(0,3);
}

/* ---------- Adaptive picker (внутри текущего блока) ---------- */
/* Пул: незакреплённые слова открытых блоков. Правило открытия следующего блока — все слова блока достигли цели.
   Вес слова = 1 + его прогресс: слово 4/5 показывается чаще, чем 1/5 (как в ТЗ). Ошибка возвращает слово через 2–3 карточки. */
function studyPool(mode){
  var pool = unlockedWords().filter(function(w){return !isMastered(w.id);});
  if(mode==='mistakes') pool = pool.filter(function(w){return ensure(w.id).w>0;});
  return pool;
}
function weightOf(p){ return 1 + p.c; }
function pickNext(){
  var pool = studyPool(studyMode);
  if(!pool.length) return null;
  cardCounter++;
  var ids = pool.map(function(w){return w.id;});
  retry = retry.filter(function(r){return ids.indexOf(r.id)>=0;});
  for(var i=0;i<retry.length;i++){
    if(retry[i].due<=cardCounter && (retry[i].id!==lastId || pool.length===1)){
      var rid = retry[i].id; retry.splice(i,1); return rid;
    }
  }
  var cand = pool.filter(function(w){return w.id!==lastId;});
  if(!cand.length) cand = pool;
  var total = 0; cand.forEach(function(w){ total += weightOf(ensure(w.id)); });
  var r = Math.random()*total;
  for(var j=0;j<cand.length;j++){
    r -= weightOf(ensure(cand[j].id));
    if(r<=0) return cand[j].id;
  }
  return cand[cand.length-1].id;
}

function statsData(){
  var words=currentWords(); var all=words.length, mastered=0, learning=0, news=0, review=0;

    if(wordBlock(w)>ub) return;
    if(st==='mastered') mastered++;
    else if(st==='new') news++;
    else { learning++; if(ensure(w.id).w>0) review++; }
  });
  return {all:all, mastered:mastered, learning:learning, news:news, review:review};
}

function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t;} return a; }

/* Ошибка -> слово вернётся через 2–3 карточки (раньше остальных), прогресс слова при этом уже уменьшен на 1 */
var blockJustDone=false;
function requeueWrong(id){
  retry = retry.filter(function(r){return r.id!==id;});
  retry.push({id:id, due: cardCounter + 2 + Math.floor(Math.random()*2)});
}

window.__startStudy = function(mode){
  studyMode = mode; retry = []; cardCounter = 0; lastId = null; blockJustDone = false;
  session = {correct:0,wrong:0,masteredNow:0,blocksOpened:0};
  currentId = pickNext();
  if(!currentId){

    document.getElementById('app').innerHTML = header('Сессия завершена', true) +
      '<div class="card"><p>'+(mode==='mistakes'?'Сейчас нет слов, требующих дополнительного повторения.':'Ты прошёл все слова этой колоды.')+'</p></div>'+
      '<button class="btn btn-primary" onclick="__go(\'home\')">На главную</button>';
    updateBackButton();
    return;
  }
  go('study');
};
window.__answer = function(wordId, chosenId, btnEl){
  if(currentAnswered) return;
  currentAnswered=true;
  var correct = chosenId===wordId;
  var p = ensure(wordId);
  var target = masterTarget();
  var wasMastered=false;
  if(correct){ p.c=Math.min(target, p.c+1); session.correct++; if(p.c>=target) wasMastered=true; }
  else { p.c=Math.max(0, p.c-1); p.w++; session.wrong++; requeueWrong(wordId); }
  p.last=Date.now();
  saveProgress(progress);
  if(wasMastered) session.masteredNow++;
  if(checkUnlock()){ session.blocksOpened++; blockJustDone=true; }
  var opts = document.querySelectorAll('#opts .opt');
  opts.forEach(function(b){
    if(b.getAttribute('data-id')===wordId) b.classList.add('correct');
    else if(b===btnEl) b.classList.add('wrong');
    b.disabled=true;
  });
  window.__pendingFeedback = {id:wordId, correct:correct};
  setTimeout(function(){
    document.getElementById('app').innerHTML = renderFeedback(wordId, correct);
  }, 550);
};
window.__continueStudy = function(){
  lastId = currentId;
  if(blockJustDone){ blockJustDone=false; currentId=null; }
  else currentId = pickNext();
  document.getElementById('app').innerHTML = renderStudy();
};

  var dl = null;

  if(!dl){ alert('Сохранение файла недоступно в этом окне.'); return; }

window.__importFileChosen = function(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(!data || data.app!=='ielts-vocab' || !data.progress) throw new Error('bad');
      progress = data.progress;
      meta = Object.assign(loadMeta(), data.meta||{});
      saveProgress(progress); saveMeta(meta);
      applyMode(); applyThemeVars(); applyHighlightVars();
      screen='home'; navStack=[]; render();
      alert('Прогресс восстановлен.');
    }catch(e){ alert('Не удалось прочитать файл резервной копии.'); }
  };
  reader.readAsText(file,'utf-8');
  input.value='';
};

      '<p class="muted" style="margin-bottom:10px">Сколько правильных ответов подряд нужно для закрепления слова</p>'+
      '<div class="chips">'+MASTER_TARGETS.map(function(n){return '<button class="chip'+(masterTarget()===n?' active':'')+'" onclick="__setMasterTarget('+n+')">'+n+'</button>';}).join('')+'</div>'+
      '<p class="muted" style="margin-top:10px">Ошибка не обнуляет прогресс слова целиком, а откатывает его на 1 шаг назад — так закрепление честнее отражает реальное знание слова.</p>'+
    '</div>'+
    '<div class="card">'+
      '<p class="muted" style="margin-bottom:10px">Резервная копия прогресса</p>'+
      '<button class="btn btn-secondary" onclick="__exportData()">Сохранить прогресс в файл</button>'+
      '<button class="btn btn-secondary" onclick="document.getElementById(\'importFileInput\').click()">Восстановить из файла</button>'+
      '<p class="muted" style="margin-top:10px">Пригодится при смене телефона или очистке данных Telegram.</p>'+
    '</div>';
}

function render(){
  var app=document.getElementById('app');
  if(screen==='home') app.innerHTML = renderHome();
  else if(screen==='study') app.innerHTML = renderStudy();
  else if(screen==='list') app.innerHTML = renderList();
  else if(screen==='progress') app.innerHTML = renderProgress();
  else if(screen==='settings') app.innerHTML = renderSettings();
  updateBackButton();
}
render();
})();
</script>
