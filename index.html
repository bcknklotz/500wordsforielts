:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#14161a; --muted:#6b7280;

}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){

    --bg:#111317; --card:#1b1e24; --text:#f2f3f5; --muted:#9aa0aa;

}
:root[data-theme="dark"]{
  --bg:#111317; --card:#1b1e24; --text:#f2f3f5; --muted:#9aa0aa;
  --accent:#5b8cff; --accent-weak:#232a44; --border:#2a2d34;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{

.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}

.progressbar{height:8px;border-radius:6px;background:var(--accent-weak);overflow:hidden;margin:10px 0;transition:background-color .25s ease}
.progressbar>div{height:100%;background:var(--accent);border-radius:6px;transition:width .3s, background-color .25s ease}
.stat-row{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:4px 0}
.muted{color:var(--muted);font-size:13px}
.big{font-size:22px;font-weight:700}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;margin-bottom:10px;min-height:48px;cursor:pointer;transition:transform .1s ease, background-color .2s ease, border-color .2s ease}

.opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
.opt:disabled{opacity:.6}
.word-en{font-size:26px;font-weight:700;letter-spacing:.2px}
.ipa{color:var(--muted);font-size:15px;margin-top:2px}
.pos{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--border);padding:2px 8px;border-radius:8px;margin-top:6px}
.dots{display:flex;gap:6px;margin:10px 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--border);transition:background-color .25s ease}
.dot.on{background:var(--accent)}
.swatches{display:flex;gap:14px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--border) inset}
.swatch.active{border-color:var(--text)}
.feedback-title{font-size:15px;font-weight:600;margin-bottom:10px}

.feedback-title.no{color:var(--wrong)}
.ex{margin-top:12px;font-size:14px;line-height:1.5}

.list-item{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.list-item:last-child{border-bottom:none}
.li-left .en{font-weight:600;font-size:15px}
.li-left .ru{color:var(--muted);font-size:13px;margin-top:2px}
.badge{font-size:11px;padding:3px 8px;border-radius:8px;background:var(--accent-weak);color:var(--accent);white-space:nowrap;margin-left:8px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}

.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;margin-bottom:12px;min-height:44px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:50}
.modal{background:var(--card);border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:480px;margin:0 auto;max-height:80vh;overflow-y:auto}
.row-between{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
</style>

function loadProgress(){ try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return {};} }

function blockSize(){ return meta.blockSize||5; }
function wordBlock(w){ return Math.ceil(w.order/blockSize()); }

function ensure(id){ if(!progress[id]) progress[id]={c:0,w:0,last:0}; return progress[id]; }
function isMastered(id){ return ensure(id).c>=5; }

  var p=ensure(id);

  if(p.c===0 && p.w===0) return 'new';
  return 'learning';

  var blockWords = WORDS.filter(function(w){return wordBlock(w)===meta.unlockedBlock;});

function recomputeUnlockedBlock(){
  var maxOrder=0;
  WORDS.forEach(function(w){ var p=progress[w.id]; if(p && (p.c>0||p.w>0)) maxOrder=Math.max(maxOrder,w.order); });
  meta.unlockedBlock = Math.max(1, Math.min(totalBlocks(), Math.ceil(maxOrder/blockSize()) || 1));
}

/* ---------- Queue building ---------- */
function buildQueue(mode){
  var pool = unlockedWords().filter(function(w){return !isMastered(w.id);});
  if(mode==='mistakes') pool = pool.filter(function(w){return ensure(w.id).w>0;});
  var news = pool.filter(function(w){return status(w.id)==='new';});
  var rest = pool.filter(function(w){return status(w.id)!=='new';});
  rest.sort(function(a,b){
    var pa=ensure(a.id), pb=ensure(b.id);
    var sa = pa.w*50 + (5-pa.c)*10 + (Date.now()-pa.last>0?0:0);
    var sb = pb.w*50 + (5-pb.c)*10;
    return sb-sa;
  });
  var q=[]; var ri=0, ni=0;
  while(ri<rest.length || ni<news.length){
    for(var k=0;k<3 && ri<rest.length;k++,ri++) q.push(rest[ri]);
    if(ni<news.length) q.push(news[ni++]);
  }
  return q.map(function(w){return w.id;});
}

/* ---------- App state ---------- */
var screen='home'; // home | study | list | progress
var studyQueue=[], studyIdx=0, session={correct:0,wrong:0,newDone:0,masteredNow:0};
var listFilter='all', listSearch='';
var navStack=[];

function go(s){ navStack.push(screen); screen=s; render(); updateBackButton(); }
function back(){ screen = navStack.pop() || 'home'; render(); updateBackButton(); }
function updateBackButton(){
  if(!tg) return;
  if(screen==='home'){ tg.BackButton.hide(); } else { tg.BackButton.show(); }
}
if(tg){ tg.BackButton.onClick(function(){ back(); }); }

/* ---------- Rendering helpers ---------- */
function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function header(title, showBack, rightHtml){
  return '<div class="header">'+
    (showBack?'<button onclick="__back()">‹</button>':'')+
    '<h2 style="flex:1">'+esc(title)+'</h2>'+
    (rightHtml||'')+
    '</div>';
}

function statsData(){
  var all=WORDS.length, mastered=0, learning=0, news=0, review=0;
  WORDS.forEach(function(w){
    var st=status(w.id);
    if(wordBlock(w)>meta.unlockedBlock) return;
    if(st==='mastered') mastered++;
    else if(st==='new') news++;
    else { learning++; if(ensure(w.id).w>0) review++; }
  });
  return {all:all, mastered:mastered, learning:learning, news:news, review:review};
}

function renderHome(){
  var s = statsData();
  var pct = Math.round(100*s.mastered/WORDS.length);
  var html = header('IELTS Vocabulary', false, '<button onclick="__go(\'settings\')" aria-label="Настройки">⚙️</button>') +
  '<div class="card">'+
    '<p class="muted">Сегодня</p>'+
    '<div class="stat-row"><span>Новые слова</span><span>'+s.news+'</span></div>'+
    '<div class="stat-row"><span>Слова на повторение</span><span>'+s.review+'</span></div>'+
    '<p class="muted" style="margin-top:14px">Общий прогресс</p>'+
    '<div class="big">'+s.mastered+' / '+WORDS.length+'</div>'+
    '<div class="progressbar"><div style="width:'+pct+'%"></div></div>'+
  '</div>'+
  '<button class="btn btn-primary" onclick="__startStudy(\'all\')">Продолжить обучение</button>'+
  '<button class="btn btn-secondary" onclick="__startStudy(\'mistakes\')">Повторить ошибки</button>'+
  '<button class="btn btn-secondary" onclick="__go(\'list\')">Все слова</button>'+
  '<button class="btn btn-secondary" onclick="__go(\'progress\')">Прогресс</button>';
  return html;
}

var currentAnswered=false;

function renderStudy(){
  if(studyIdx>=studyQueue.length){
    return header('Сессия завершена', true) +
    '<div class="card">'+
      '<p class="muted">Сегодня</p>'+
      '<div class="stat-row"><span>Правильных ответов</span><span>'+session.correct+'</span></div>'+
      '<div class="stat-row"><span>Ошибок</span><span>'+session.wrong+'</span></div>'+
      '<div class="stat-row"><span>Слов закреплено</span><span>'+session.masteredNow+'</span></div>'+
    '</div>'+
    '<button class="btn btn-primary" onclick="__startStudy(\'all\')">Продолжить обучение</button>'+
    (statsData().review>0?'<button class="btn btn-secondary" onclick="__startStudy(\'mistakes\')">Повторить ошибки</button>':'')+
    '<button class="btn btn-text" onclick="__go(\'home\')">Продолжить позже</button>';
  }
  var id = studyQueue[studyIdx];
  var w = BY_ID[id];
  var p = ensure(id);
  var wb = wordBlock(w);
  var blockWords = WORDS.filter(function(x){return wordBlock(x)===wb;});
  var blockIdx = blockWords.findIndex(function(x){return x.id===id;})+1;
  currentAnswered=false;
  var opts = [id].concat(w.distractors).map(function(oid){return BY_ID[oid];});
  opts = shuffle(opts.slice());
  var dots=''; for(var i=0;i<5;i++) dots+='<span class="dot'+(i<p.c?' on':'')+'"></span>';
  var html = header('Block '+wb, true) +
    '<p class="muted">'+blockIdx+' / '+blockWords.length+'</p>'+
    '<div class="card">'+
      '<div class="word-en">'+esc(w.en)+'</div>'+
      '<div class="ipa">'+esc(w.ipa)+'</div>'+
      '<span class="pos">'+esc(w.pos)+'</span>'+
      '<p style="margin-top:16px;font-weight:600">Что означает это слово?</p>'+
    '</div>'+
    '<div id="opts">' +
      opts.map(function(o){return '<button class="opt" data-id="'+o.id+'" onclick="__answer(\''+id+'\',\''+o.id+'\',this)">'+esc(o.ru)+'</button>';}).join('') +
    '</div>'+
    '<div class="dots">'+dots+'</div>'+
    '<p class="muted">Закрепление: '+p.c+'/5</p>';
  return html;
}

function renderFeedback(id, correct, chosenId){
  var w=BY_ID[id];
  return header(correct?'Правильно':'Почти', true) +
  '<div class="card">'+
    '<p class="feedback-title '+(correct?'ok':'no')+'">'+(correct?'✓ Правильно':'Почти. Запомни это слово.')+'</p>'+
    '<div class="word-en">'+esc(w.en)+'</div>'+
    '<div class="ipa">'+esc(w.ipa)+'</div>'+
    '<p style="margin-top:10px">'+esc(w.ru)+'</p>'+
    (w.syn?'<p class="muted" style="margin-top:6px">Syn: '+esc(w.syn)+'</p>':'')+
    '<div class="ex"><p class="en">"'+esc(w.exEn)+'"</p><p class="ru">'+esc(w.exRu)+'</p></div>'+
  '</div>'+
  '<button class="btn btn-primary" onclick="__continueStudy()">Продолжить</button>';
}

function renderList(){
  var chips=[['all','Все'],['new','Новые'],['learning','Изучаются'],['mastered','Закреплены'],['mistakes','Ошибки']];
  var words = unlockedWords().filter(function(w){
    if(listFilter==='mistakes') { if(ensure(w.id).w<=0) return false; }
    else if(listFilter!=='all' && status(w.id)!==listFilter) return false;
    if(listSearch){
      var q=listSearch.toLowerCase();
      if(w.en.toLowerCase().indexOf(q)<0 && w.ru.toLowerCase().indexOf(q)<0) return false;
    }
    return true;
  });
  var html = header('Мои слова', true) +
    '<input type="text" placeholder="🔍 Найти слово" value="'+esc(listSearch)+'" oninput="__search(this.value)">'+
    '<div class="chips">' + chips.map(function(c){return '<button class="chip'+(listFilter===c[0]?' active':'')+'" onclick="__filter(\''+c[0]+'\')">'+c[1]+'</button>';}).join('') + '</div>'+
    '<div class="card">' +
      (words.length? words.map(function(w){
        var p=ensure(w.id); var st=status(w.id);
        var label = st==='mastered'?'MASTERED':(st==='new'?'NEW':p.c+'/5');
        return '<div class="list-item" onclick="__showWord(\''+w.id+'\')"><div class="li-left"><div class="en">'+esc(w.en)+'</div><div class="ru">'+esc(w.ru)+'</div></div><span class="badge">'+label+'</span></div>';
      }).join('') : '<p class="muted">Ничего не найдено</p>')+
    '</div>';
  return html;
}

function renderProgress(){
  var s = statsData();
  var pct = Math.round(100*s.mastered/WORDS.length);
  return header('Мой прогресс', true) +
  '<div class="card">'+
    '<div class="big">'+s.mastered+' / '+WORDS.length+' закреплено</div>'+
    '<div class="progressbar"><div style="width:'+pct+'%"></div></div>'+
    '<p class="muted">'+pct+'%</p>'+
  '</div>'+
  '<div class="card">'+
    '<div class="stat-row"><span>Новые</span><span>'+s.news+'</span></div>'+
    '<div class="stat-row"><span>Изучаются</span><span>'+s.learning+'</span></div>'+
    '<div class="stat-row"><span>Закреплены</span><span>'+s.mastered+'</span></div>'+
    '<div class="stat-row"><span>Требуют повторения</span><span>'+s.review+'</span></div>'+
  '</div>'+
  '<p class="muted" style="text-align:center">Открыто блоков: '+meta.unlockedBlock+' из '+totalBlocks()+' (по '+blockSize()+' слов)</p>';
}

function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t;} return a; }

/* Пропускаем позиции в очереди, где слово уже успели закрепить (5/5) раньше по ходу сессии */
function advanceToValid(){
  while(studyIdx<studyQueue.length && isMastered(studyQueue[studyIdx])) studyIdx++;
}

/* Ошибка -> возвращаем слово в очередь через 3-5 карточек, чтобы оно всплыло снова в этой же сессии */
function requeueWrong(id){
  var gap = 3 + Math.floor(Math.random()*3); // 3..5
  var insertAt = Math.min(studyIdx + gap, studyQueue.length);
  studyQueue.splice(insertAt, 0, id);
}

/* ---------- Global handlers ---------- */
window.__go = function(s){ go(s); };
window.__back = function(){ back(); };
window.__startStudy = function(mode){
  studyQueue = buildQueue(mode);
  studyIdx = 0; session={correct:0,wrong:0,newDone:0,masteredNow:0};
  advanceToValid();
  if(studyQueue.length===0){
    screen='study'; navStack.push('home');
    document.getElementById('app').innerHTML = header('Сессия завершена', true) +
      '<div class="card"><p>'+(mode==='mistakes'?'Сейчас нет слов, требующих дополнительного повторения.':'Ты прошёл все доступные слова. Приложение будет помогать поддерживать их в памяти.')+'</p></div>'+
      '<button class="btn btn-primary" onclick="__go(\'home\')">На главную</button>';
    updateBackButton();
    return;
  }
  go('study');
};
window.__answer = function(wordId, chosenId, btnEl){
  if(currentAnswered) return;
  currentAnswered=true;
  var correct = chosenId===wordId;
  var p = ensure(wordId);
  var wasMastered=false;
  if(correct){ p.c++; session.correct++; if(p.c>=5) wasMastered=true; }
  else { p.w++; session.wrong++; requeueWrong(wordId); }
  p.last=Date.now();
  saveProgress(progress);
  checkUnlock();
  if(wasMastered) session.masteredNow++;
  var opts = document.querySelectorAll('#opts .opt');
  opts.forEach(function(b){
    if(b.getAttribute('data-id')===wordId) b.classList.add('correct');
    else if(b===btnEl) b.classList.add('wrong');
    b.disabled=true;
  });
  window.__pendingFeedback = {id:wordId, correct:correct};
  setTimeout(function(){
    document.getElementById('app').innerHTML = renderFeedback(wordId, correct);
  }, 550);
};
window.__continueStudy = function(){
  studyIdx++;
  advanceToValid();
  document.getElementById('app').innerHTML = renderStudy();
};
window.__filter = function(f){ listFilter=f; render(); };
window.__search = function(v){ listSearch=v; render(); };
window.__setMode = function(m){ meta.mode=m; saveMeta(meta); applyMode(); applyThemeVars(); render(); };
window.__setAccent = function(id){ meta.theme=id; saveMeta(meta); applyThemeVars(); render(); };
window.__setBlockSize = function(n){ meta.blockSize=n; recomputeUnlockedBlock(); saveMeta(meta); render(); };
window.__showWord = function(id){
  var w=BY_ID[id], p=ensure(id);
  var m = el('<div class="modal-bg" onclick="if(event.target===this) this.remove()"></div>');
  m.innerHTML = '<div class="modal">'+
    '<div class="row-between"><div><div class="word-en">'+esc(w.en)+'</div><div class="ipa">'+esc(w.ipa)+'</div></div><span class="pos">'+esc(w.pos)+'</span></div>'+
    '<p style="margin-top:12px;font-weight:600">'+esc(w.ru)+'</p>'+
    (w.syn?'<p class="muted">Synonym: '+esc(w.syn)+'</p>':'')+
    '<p class="muted" style="margin-top:10px">Definition</p><p>'+esc(w.defRu)+'</p>'+
    '<div class="ex"><p class="en">"'+esc(w.exEn)+'"</p><p class="ru">'+esc(w.exRu)+'</p></div>'+
    '<div class="stat-row" style="margin-top:14px"><span>Progress</span><span>'+p.c+'/5</span></div>'+
    '<div class="stat-row"><span>Ошибок</span><span>'+p.w+'</span></div>'+
    '<button class="btn btn-secondary" style="margin-top:10px" onclick="this.closest(\'.modal-bg\').remove()">Закрыть</button>'+
  '</div>';
  document.body.appendChild(m);
};

function renderSettings(){
  var modes=[['auto','Авто'],['light','Светлая'],['dark','Тёмная']];
  return header('Настройки', true) +
    '<div class="card">'+
      '<p class="muted" style="margin-bottom:10px">Оформление</p>'+
      '<div class="chips">'+modes.map(function(m){return '<button class="chip'+((meta.mode||'auto')===m[0]?' active':'')+'" onclick="__setMode(\''+m[0]+'\')">'+m[1]+'</button>';}).join('')+'</div>'+
    '</div>'+
    '<div class="card">'+
      '<p class="muted" style="margin-bottom:10px">Акцентный цвет</p>'+
      '<div class="swatches">'+THEMES.map(function(t){return '<button class="swatch'+((meta.theme||'blue')===t.id?' active':'')+'" style="background:'+t.accent+'" title="'+esc(t.name)+'" onclick="__setAccent(\''+t.id+'\')"></button>';}).join('')+'</div>'+
    '</div>'+
    '<div class="card">'+
      '<p class="muted" style="margin-bottom:10px">Слов в блоке</p>'+
      '<div class="chips">'+BLOCK_SIZES.map(function(n){return '<button class="chip'+(blockSize()===n?' active':'')+'" onclick="__setBlockSize('+n+')">'+n+'</button>';}).join('')+'</div>'+
      '<p class="muted" style="margin-top:10px">Меньше слов в блоке — легче удерживать внимание, но чаще переключение между блоками.</p>'+
    '</div>';
}

function render(){
  var app=document.getElementById('app');
  if(screen==='home') app.innerHTML = renderHome();
  else if(screen==='study') app.innerHTML = renderStudy();
  else if(screen==='list') app.innerHTML = renderList();
  else if(screen==='progress') app.innerHTML = renderProgress();
  else if(screen==='settings') app.innerHTML = renderSettings();
  updateBackButton();
}
render();
})();
</script>
